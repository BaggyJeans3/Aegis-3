name: Deploy Aegis-3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Tailscale 네트워크 접속
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github

      - name: EC2에 접속해서 도커 실행하기
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_TAILSCALE_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 최초 1회 clone
            if [ ! -d "/home/ubuntu/Aegis-3/.git" ]; then
              git clone https://github.com/BaggyJeans3/Aegis-3.git /home/ubuntu/Aegis-3
            fi

            cd /home/ubuntu/Aegis-3

            git fetch origin
            # main 브랜치로 강제 전환 (이름표까지 main 으로 맞춤)
            git checkout -B main origin/main
            git reset --hard origin/main

            # env 생성
            cat <<EOF > .env
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DB_USER=aegis_admin
            DB_NAME=aegis_proxy
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            EOF

            # analyzer env 생성
            mkdir -p services/ingestion/analyzer
            cat <<EOF > services/ingestion/analyzer/.env
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            CF_TOKEN=${{ secrets.CF_TOKEN }}
            ZONE_ID=${{ secrets.ZONE_ID }}
            SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
            SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            SLACK_APP_TOKEN=${{ secrets.SLACK_APP_TOKEN }}
            EOF

            # 기존 컨테이너 중지 (실행 중인 이미지를 prune하기 위해 필수)
            sudo docker compose down

            # 호스트 시스템 디스크 용량 확보 (우분투 로그 및 apt 패키지 캐시 청소)
            sudo apt-get clean
            sudo journalctl --vacuum-size=50M

            # 도커 정리 (용량 확보).
            # [중요] base 이미지(mongo/postgres/redis/python)는 보존한다.
            # 예전엔 `system prune -af` 로 모든 이미지를 지웠는데, 그러면 매 배포마다
            # base 이미지를 재pull → Docker Hub 익명 pull rate limit 에 막혀 배포가 실패한다.
            # 용량 주범인 '빌드 캐시'와 'dangling(태그 없는) 레이어'만 정리하면 충분하다.
            sudo docker container prune -f
            sudo docker image prune -f       # dangling 만 — 태그된 base 이미지는 보존
            sudo docker builder prune -af    # 빌드 캐시 (용량 최대 절감)

            # 도커 실행 (EC2 운영용 override 포함: nginx 를 host 80 에 게시 → Cloudflare 프록시 연결)
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # DB 스키마 보강 (볼륨 보존 환경이라 init.sql이 재실행되지 않으므로,
            # 이미 존재하는 tenants 테이블에 신규 컬럼을 직접 추가)
            echo "PostgreSQL 컨테이너 준비 대기..."
            for i in $(seq 1 30); do
              if sudo docker exec aegis-postgres pg_isready -U aegis_admin -d aegis_proxy; then
                break
              fi
              sleep 2
            done

            sudo docker exec aegis-postgres psql -U aegis_admin -d aegis_proxy -c "ALTER TABLE tenants ADD COLUMN IF NOT EXISTS supabase_user_id UUID;"
            sudo docker exec aegis-postgres psql -U aegis_admin -d aegis_proxy -c "ALTER TABLE tenants ADD COLUMN IF NOT EXISTS spec_text TEXT;"
            sudo docker exec aegis-postgres psql -U aegis_admin -d aegis_proxy -c "CREATE INDEX IF NOT EXISTS idx_tenants_supabase_user ON tenants(supabase_user_id);"

            # MongoDB 로그 컬렉션 정합 (worker=portal 둘 다 traffic_logs 사용).
            # 과거 worker 가 security_logs 에 쌓아둔 실데이터를 traffic_logs 로 1회 이관.
            # idempotent: security_logs 가 없으면 그냥 skip → 매 배포 재실행해도 안전.
            # (traffic_logs 는 절대 drop 하지 않음)
            echo "MongoDB 컨테이너 준비 대기..."
            for i in $(seq 1 30); do
              if sudo docker exec aegis-mongodb mongosh -u aegis_user -p "${{ secrets.MONGO_PASSWORD }}" --authenticationDatabase admin --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            sudo docker exec aegis-mongodb mongosh -u aegis_user -p "${{ secrets.MONGO_PASSWORD }}" --authenticationDatabase admin aegis_logs --quiet --eval '
              const names = db.getCollectionNames();
              if (names.indexOf("security_logs") !== -1) {
                let n = 0;
                db.security_logs.find().forEach(function (d) { try { db.traffic_logs.insertOne(d); n++; } catch (e) {} });
                db.security_logs.drop();
                print("[migrate] security_logs -> traffic_logs: " + n + " docs 이관 후 security_logs drop");
              } else {
                print("[migrate] security_logs 없음 — 이관 skip (정상)");
              }
            '
