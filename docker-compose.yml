version: '3.8'

services:
  # 1. Nginx + Coraza WAF (+ 룰 주입 사이드카: 같은 컨테이너에서 :4000)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: aegis-nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    expose:
      - '4000'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/coraza.conf:/etc/nginx/coraza.conf
      # AI 가 동적으로 적재하는 룰(dynamic.conf 등) 영속화.
      # 첫 기동 시 이미지의 aegis3-custom-rules.conf 가 자동 복사되고, 이후 재시작에도 dynamic.conf 보존.
      - nginx_dynamic_rules:/etc/nginx/rules
    depends_on:
      - proxy
    networks:
      - aegis-net

  # 2. 프록시 서버 (Node.js)
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: aegis-proxy
    env_file: .env
    environment:
      - DB_HOST=postgres-db # DB 서비스 이름 일치
      - REDIS_HOST=redis # Redis 서비스 이름 일치
      - DB_USER=aegis_admin
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=aegis_proxy
      - MONGO_URI=mongodb://aegis_user:${MONGO_PASSWORD}@mongodb:27017/aegis_logs?authSource=admin
    depends_on:
      - postgres-db
      - redis
      - mongodb
    restart: unless-stopped
    networks:
      - aegis-net

  # 3. PostgreSQL (라우팅 정보 DB)
  postgres-db:
    image: postgres:15-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-aegis_proxy}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - aegis-net

  # 4. Redis (캐시)
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    networks:
      - aegis-net
    ports:
      - "6379:6379"

  # 5. MongoDB (로그 저장)
  mongodb:
    image: mongo:latest
    container_name: aegis-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: aegis_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - aegis-net

# 6. SOAR 데이터 수집 API (FastAPI)
  soar-api:
    build:
      context: ./services/ingestion/celery_app
      dockerfile: Dockerfile
    container_name: aegis-soar-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0 # Docker 내부에서는 서비스 이름(redis)으로 통신
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MONGO_URI=mongodb://aegis_user:${MONGO_PASSWORD}@mongodb:27017/aegis_logs?authSource=admin
      - MONGO_USER=aegis_user
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_AUTH_SOURCE=admin
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_RULE_THRESHOLD=${AI_RULE_THRESHOLD:-80}
      - NGINX_SIDECAR_URL=${NGINX_SIDECAR_URL:-http://nginx:4000/api/v1/rules/inject}
    depends_on:
      - redis
      - mongodb
    networks:
      - aegis-net
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # 7. Risk Score Engine
  detection-engine:
    build:
      context: .
      dockerfile: soar/risk_score_engine/Dockerfile
    container_name: aegis-detection-engine
    restart: unless-stopped
    ports:
      - "5001:5000"
    networks:
      - aegis-net
  # 8. SOAR 백그라운드 워커 (Celery)
  soar-worker:
    build:
      context: ./services/ingestion/celery_app
      dockerfile: Dockerfile
    container_name: aegis-soar-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MONGO_URI=mongodb://aegis_user:${MONGO_PASSWORD}@mongodb:27017/aegis_logs?authSource=admin
      - MONGO_USER=aegis_user
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_AUTH_SOURCE=admin
      - RISK_ANALYZER_URL=http://detection-engine:5000/analyze
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_RULE_THRESHOLD=${AI_RULE_THRESHOLD:-80}
      - NGINX_SIDECAR_URL=${NGINX_SIDECAR_URL:-http://nginx:4000/api/v1/rules/inject}
    depends_on:
      - redis
      - mongodb
      - soar-api
      - detection-engine
    networks:
      - aegis-net
    command: celery -A tasks:celery_app worker --beat --loglevel=info

  # 9. 실시간 알림 및 차단 대응 엔진 (Node.js)
  analyzer:
    build:
      context: ./services/ingestion/analyzer
      dockerfile: Dockerfile
    container_name: aegis-analyzer
    restart: unless-stopped
    env_file: ./services/ingestion/analyzer/.env
    ports:
      - "3000:3000"
      - "5000:5000"
    networks:
      - aegis-net

  # 10. 고객사 대시보드 로그 전달용 API 엔진 (FastAPI)
  #     - MongoDB: 트래픽 로그 조회/스트림
  #     - PostgreSQL: 고객사(tenants) 등록/조회
  portal-backend:
    build:
      context: ./services/aegis-portal-backend
      dockerfile: Dockerfile
    container_name: aegis-portal-backend
    restart: unless-stopped
    environment:
      - MONGO_USER=aegis_user
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=aegis-mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=aegis_logs
      - DB_USER=aegis_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=aegis-postgres
      - POSTGRES_PORT=5432
      - DB_NAME=aegis_proxy
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
      - postgres-db
    networks:
      - aegis-net

# 볼륨(데이터 영구 저장) 정의
volumes:
  postgres_data:
  mongo_data:
  nginx_dynamic_rules:

# 도커 내부 통신망 정의
networks:
  aegis-net:
    driver: bridge
