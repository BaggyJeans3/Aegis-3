version: '3.8'

services:
  # 1. Nginx + Coraza WAF
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: aegis-nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/coraza.conf:/etc/nginx/coraza.conf
    depends_on:
      - proxy
    networks:
      - aegis-net

  # 2. 프록시 서버 (Node.js)
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: aegis-proxy
    env_file: .env
    environment:
      - DB_HOST=postgres-db # DB 서비스 이름 일치
      - REDIS_HOST=redis # Redis 서비스 이름 일치
      - DB_USER=aegis_admin
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=aegis_proxy
      - MONGO_URI=mongodb://aegis_user:${MONGO_PASSWORD}@mongodb:27017/aegis_logs?authSource=admin
    depends_on:
      - postgres-db
      - redis
      - mongodb
    restart: unless-stopped
    networks:
      - aegis-net

  # 3. PostgreSQL (라우팅 정보 DB)
  postgres-db:
    image: postgres:15-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-aegis_proxy}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - aegis-net

  # 4. Redis (캐시)
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    networks:
      - aegis-net
    ports:
      - "6379:6379"

  # 5. MongoDB (로그 저장)
  mongodb:
    image: mongo:latest
    container_name: aegis-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: aegis_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - aegis-net

# 6. SOAR 데이터 수집 API (FastAPI)
  soar-api:
    build:
      context: ./services/ingestion/celery_app
      dockerfile: Dockerfile
    container_name: aegis-soar-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0 # Docker 내부에서는 서비스 이름(redis)으로 통신
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MONGO_URI=mongodb://aegis_user:${MONGO_PASSWORD}@mongodb:27017/aegis_logs?authSource=admin
    depends_on:
      - redis
      - mongodb
    networks:
      - aegis-net
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # 7. Risk Score Engine
  detection-engine:
    build:
      context: .
      dockerfile: soar/risk_score_engine/Dockerfile
    container_name: aegis-detection-engine
    restart: unless-stopped
    ports:
      - "5001:5000"
    networks:
      - aegis-net
  # 8. SOAR 백그라운드 워커 (Celery)
  soar-worker:
    build:
      context: ./services/ingestion/celery_app
      dockerfile: Dockerfile
    container_name: aegis-soar-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MONGO_URI=mongodb://aegis_user:${MONGO_PASSWORD}@mongodb:27017/aegis_logs?authSource=admin
      - RISK_ANALYZER_URL=http://detection-engine:5000/analyze    
    depends_on:
      - redis
      - mongodb
      - soar-api
      - detection-engine
    networks:
      - aegis-net
    command: celery -A tasks:celery_app worker --loglevel=info

  # 9. 실시간 알림 및 차단 대응 엔진 (Node.js)
  analyzer:
    build:
      context: ./services/ingestion/analyzer
      dockerfile: Dockerfile
    container_name: aegis-analyzer
    restart: unless-stopped
    env_file: ./services/ingestion/analyzer/.env
    ports:
      - "3000:3000"
      - "5000:5000"
    networks:
      - aegis-net

# 볼륨(데이터 영구 저장) 정의
volumes:
  postgres_data:
  mongo_data:

# 도커 내부 통신망 정의
networks:
  aegis-net:
    driver: bridge
