load_module /usr/lib/nginx/modules/ngx_http_coraza_module.so;
load_module /usr/lib/nginx/modules/ngx_http_subs_filter_module.so;

user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Coraza WAF (coraza-nginx v0.11.0 디렉티브)
    coraza on;
    coraza_rules_file /etc/nginx/coraza.conf;

    # ── [Rate Limit] 단일 IP 분당 요청 제한 (L7 1차 방어) ──
    # 키: $binary_remote_addr (프론트 server :80 에서 = 실제 클라이언트 IP).
    # rate=60r/m → IP당 평균 분당 60회(=1초 1회), burst=20 까지 순간 허용(nodelay).
    # 초과분은 대기 없이 즉시 429 응답. 운영 트래픽 특성에 맞게 rate/burst 조정.
    # 적용은 프론트 server 의 location / 에서만 (검증용 /__masking_test__/ 는 제외).
    limit_req_zone $binary_remote_addr zone=aegis_per_ip:10m rate=60r/m;
    limit_req_status 429;

    # ── 2-pass 구조: Coraza response body 필터 ↔ subs_filter zero-size-buf 충돌 회피 ──
    # 한 pass 안에서 Coraza body 필터와 subs_filter 가 공존하면, subs 가 만든 recycled
    # 버퍼를 Coraza response body 필터가 받아 "zero size buf in writer" 로 4KB 초과 응답을
    # 끊는다(클라이언트로 0바이트 전송). coraza-nginx 0.11.0 은 SecResponseBodyAccess Off
    # 로도 body 필터를 체인에서 빼지 못하고, 응답 본문만 끄는 디렉티브도 없다(coraza on|off
    # 이진뿐, off 는 요청측 WAF 까지 끔). 따라서 두 필터를 서로 다른 server(pass)로 분리한다.
    #   - 프론트 server(:80)    : coraza on  → 요청측 WAF. subs 없음.
    #   - 내부  server(:8081)   : coraza off → body 필터 제거. subs 마스킹 전담.
    # 내부 server 가 응답을 이미 마스킹해 '평문 바이트'로 올려보내므로, 프론트의 Coraza
    # 필터는 일반 proxy 버퍼만 다뤄 충돌하지 않는다.

    # [내부 server] 마스킹 전담. coraza off 라 subs 와 충돌 없음.
    server {
        listen       127.0.0.1:8081;
        server_name  _;

        coraza off;

        # --- [개인정보 마스킹 미들웨어 - 정규식 기반] ---
        # subs_filter <pattern> <replace> <flags>  (g:global, r:regex, i:case-insensitive)
        # 형식 유지 + 값만 가리는 방식 (실무 관행: 일부 식별자만 보존).
        subs_filter_types application/json application/xml text/html text/plain;

        # 전화번호: 010-1234-5678 등 (앞자리 보존). 한계: 02-XXX-XXXX(서울 2자리) 미매칭.
        subs_filter '(\d{3})-(\d{3,4})-(\d{4})' '$1-****-****' gr;

        # 주민등록번호: 900101-1234567 (생년월일+성별자리 보존). 한계: 외국인등록 뒷자리 5~8 미매칭.
        subs_filter '(\d{6})-([1-4])(\d{6})' '$1-$2******' gr;

        # 카드번호: 1234-5678-9012-3456 (뒤 4자리 보존). 한계: AMEX(4-6-5)/무하이픈 16자리 미매칭.
        subs_filter '(\d{4})-(\d{4})-(\d{4})-(\d{4})' '****-****-****-$4' gr;

        # 이메일: user@example.com (도메인 보존). 한계: JSON 내 - 등 escape 문자열 미매칭.
        subs_filter '([\w.+-]+)@([\w-]+\.[\w.-]+)' '****@$2' gr;

        location / {
            # 이지스 프록시(Node, :3000) → MuShop 으로 전달
            proxy_pass http://proxy:3000;

            # 백엔드 응답 비압축 강제 (gzip 본문은 본문 필터가 검사 불가).
            # 한계: 매트릭스 ④ gzip 케이스는 이 라인으로 우회 처리됨 - 발표 시 명시.
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # [검증 전용] 마스킹 5×4 매트릭스 모의 백엔드 (tests/masking/mock_backend.py).
        # gzip 한계(④)를 정직하게 관찰하려고 Accept-Encoding 을 비우지 않는다.
        location /__masking_test__/ {
            proxy_pass http://mock-backend:9100/;
            proxy_set_header Host $host;
        }
    }

    # [프론트 server] 클라이언트 대면. coraza on → 요청측 WAF.
    # 내부 server 가 마스킹한 평문 응답을 받으므로 Coraza 필터와 충돌하지 않는다.
    # default_server: Host 가 아래 대시보드 API(api.aegis3.cloud) 가 아니면 전부 여기로.
    server {
        listen       80 default_server;
        server_name  localhost;

        location / {
            # 단일 IP 분당 제한 (초과 시 429). 검증 경로(/__masking_test__/)에는 미적용.
#            limit_req zone=aegis_per_ip burst=20 nodelay;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 검증 트래픽도 동일하게 내부 마스킹 패스로 전달 (경로 보존).
        location /__masking_test__/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # [대시보드 API server] Cloudflare Worker 대시보드 → portal-backend(:8001) 전용 경로.
    # Host 가 api.aegis3.cloud 인 요청만 여기로 라우팅된다(위 default_server 와 분리).
    # 대시보드 '자체' API(고객사 로그/통계 조회)는 WAF 검사 대상이 아니므로 coraza off
    # — SSE 스트림(/api/logs/stream)·JSON 바디에서의 오탐/끊김을 피한다.
    server {
        listen       80;
        server_name  console.aegis3.cloud; 
        coraza off;

        # Docker 내장 DNS. 아래 변수 proxy_pass 와 함께 쓰면 upstream 을 '시작 시 1회'가
        # 아니라 런타임에 해석 → portal-backend 가 늦게 떠도 nginx 기동이 실패하지 않는다.
        resolver 127.0.0.11 valid=30s ipv6=off;

        location / {
            set $portal_backend http://portal-backend:8001;   # 변수 → 런타임 해석
            proxy_pass $portal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE(/api/logs/stream) 지원: 버퍼링 끄고 타임아웃 길게.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
