load_module /usr/lib/nginx/modules/ngx_http_coraza_module.so;
load_module /usr/lib/nginx/modules/ngx_http_subs_filter_module.so;

user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Coraza WAF (coraza-nginx v0.11.0 디렉티브)
    coraza on;
    coraza_rules_file /etc/nginx/coraza.conf;

    # ── [Rate Limit] 단일 IP 분당 요청 제한 (L7 1차 방어) ──
    # 키: $aegis_rl_key = 실제 클라이언트 IP (아래 Real IP 복원 후 값, 예외 IP 는 빈 키 → 미적용).
    # rate=60r/m → IP당 평균 분당 60회(=1초 1회), burst=20 까지 순간 허용(nodelay).
    # 초과분은 대기 없이 즉시 429 응답. 운영 트래픽 특성에 맞게 rate/burst 조정.
    # 적용은 프론트 server 의 location / 에서만 (검증용 /__masking_test__/ 는 제외).
    limit_req_zone $aegis_rl_key zone=aegis_per_ip:10m rate=60r/m;
    limit_req_status 429;

    # ── [Real IP] Cloudflare 뒤에서 $remote_addr 를 실제 방문자 IP 로 복원 ──
    # 이 설정이 없으면 $remote_addr = Cloudflare 엣지 IP → 위 rate limit 이 '방문자별'이 아니라
    # '엣지별'로 걸려, 같은 엣지를 타는 정상 사용자들이 합산 1r/s 로 묶여 429 를 받는다
    # (9/30 k6: 정상 트래픽 107 RPS 중 77% 429).
    # CF-Connecting-IP 는 Cloudflare 가 덮어쓰는 헤더라 클라이언트가 위조할 수 없다.
    # 아래 대역에서 온 요청만 신뢰하므로 CF 를 우회해 직접 접속해도 헤더 위조가 통하지 않는다.
    # 대역 출처: https://www.cloudflare.com/ips/ (2026-09-30 기준, 변경 시 갱신)
    # 갱신: bash scripts/ops/update_cloudflare_ips.sh (아래 BEGIN~END 사이를 다시 생성)
    # BEGIN cloudflare-ips
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # END cloudflare-ips
    real_ip_header CF-Connecting-IP;

    # ── [Rate Limit 예외] 부하 테스트 등 운영자가 허용한 IP 는 limit_req 제외 ──
    # 키가 빈 문자열이면 limit_req 가 적용되지 않는다. $remote_addr 는 위 real_ip 복원 후 값.
    # 사용: 아래에 "<IP> 1;" 추가 → sudo docker exec aegis-nginx nginx -s reload
    #       테스트가 끝나면 반드시 지우고 다시 reload.
    geo $aegis_rl_exempt {
        default 0;
    }
    map $aegis_rl_exempt $aegis_rl_key {
        1       "";
        default $binary_remote_addr;
    }

    # ── 2-pass 구조: Coraza response body 필터 ↔ subs_filter zero-size-buf 충돌 회피 ──
    # 한 pass 안에서 Coraza body 필터와 subs_filter 가 공존하면, subs 가 만든 recycled
    # 버퍼를 Coraza response body 필터가 받아 "zero size buf in writer" 로 4KB 초과 응답을
    # 끊는다(클라이언트로 0바이트 전송). coraza-nginx 0.11.0 은 SecResponseBodyAccess Off
    # 로도 body 필터를 체인에서 빼지 못하고, 응답 본문만 끄는 디렉티브도 없다(coraza on|off
    # 이진뿐, off 는 요청측 WAF 까지 끔). 따라서 두 필터를 서로 다른 server(pass)로 분리한다.
    #   - 프론트 server(:80)    : coraza on  → 요청측 WAF. subs 없음.
    #   - 내부  server(:8081)   : coraza off → body 필터 제거. subs 마스킹 전담.
    # 내부 server 가 응답을 이미 마스킹해 '평문 바이트'로 올려보내므로, 프론트의 Coraza
    # 필터는 일반 proxy 버퍼만 다뤄 충돌하지 않는다.

    # [내부 server] 마스킹 전담. coraza off 라 subs 와 충돌 없음.
    server {
        listen       127.0.0.1:8081;
        server_name  _;

        coraza off;

        # Docker 내장 DNS. proxy_pass 를 변수로 받으면 컨테이너 IP를 '시작 시 1회'가 아니라
        # 런타임에 재해석한다 — 없으면 aegis-proxy 재시작으로 IP가 바뀔 때 nginx가 죽은 IP를
        # 계속 참조해 502가 난다.
        resolver 127.0.0.11 valid=30s ipv6=off;

        # --- [개인정보 마스킹 미들웨어 - 정규식 기반] ---
        # subs_filter <pattern> <replace> <flags>  (g:global, r:regex, i:case-insensitive)
        # 형식 유지 + 값만 가리는 방식 (실무 관행: 일부 식별자만 보존).
        subs_filter_types application/json application/xml text/html text/plain;

        # 전화번호: 010-1234-5678 등 (앞자리 보존). 한계: 02-XXX-XXXX(서울 2자리) 미매칭.
        subs_filter '(\d{3})-(\d{3,4})-(\d{4})' '$1-****-****' gr;

        # 주민등록번호: 900101-1234567 (생년월일+성별자리 보존). 한계: 외국인등록 뒷자리 5~8 미매칭.
        subs_filter '(\d{6})-([1-4])(\d{6})' '$1-$2******' gr;

        # 카드번호: 1234-5678-9012-3456 (뒤 4자리 보존). 한계: AMEX(4-6-5)/무하이픈 16자리 미매칭.
        subs_filter '(\d{4})-(\d{4})-(\d{4})-(\d{4})' '****-****-****-$4' gr;

        # 이메일: user@example.com (도메인 보존). 한계: JSON 내 - 등 escape 문자열 미매칭.
        subs_filter '([\w.+-]+)@([\w-]+\.[\w.-]+)' '****@$2' gr;

        location / {
            # 이지스 프록시(Node, :3000) → MuShop 으로 전달
            # 변수로 감싸 위 resolver 로 런타임 재해석되게 함 (컨테이너 재시작 IP 변경 대비).
            set $aegis_proxy_upstream http://proxy:3000;
            proxy_pass $aegis_proxy_upstream;

            # 백엔드 응답 비압축 강제 (gzip 본문은 본문 필터가 검사 불가).
            # 한계: 매트릭스 ④ gzip 케이스는 이 라인으로 우회 처리됨 - 발표 시 명시.
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            # 이 server 의 $remote_addr 는 항상 127.0.0.1(프론트 server) 이다.
            # 프론트가 덮어쓴 X-Real-IP(실제 방문자 IP)를 그대로 넘겨야 proxy 가 IP 를 식별한다.
            # (127.0.0.1 에만 listen 하므로 외부에서 이 헤더를 직접 주입할 수 없다)
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # [검증 전용] 마스킹 5×4 매트릭스 모의 백엔드 (tests/masking/mock_backend.py).
        # gzip 한계(④)를 정직하게 관찰하려고 Accept-Encoding 을 비우지 않는다.
        location /__masking_test__/ {
            set $aegis_mock_upstream http://mock-backend:9100/;
            proxy_pass $aegis_mock_upstream;
            proxy_set_header Host $host;
        }
    }

    # [프론트 server] 클라이언트 대면. coraza on → 요청측 WAF.
    # 내부 server 가 마스킹한 평문 응답을 받으므로 Coraza 필터와 충돌하지 않는다.
    # default_server: Host 가 아래 대시보드 API(api.aegis3.cloud) 가 아니면 전부 여기로.
    server {
        listen       80 default_server;
        server_name  localhost;

        location / {
            # 단일 IP 분당 제한 (초과 시 429). 검증 경로(/__masking_test__/)에는 미적용.
            limit_req zone=aegis_per_ip burst=20 nodelay;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 검증 트래픽도 동일하게 내부 마스킹 패스로 전달 (경로 보존).
        location /__masking_test__/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
        }

        error_page   500 502 503 504  /50x.html;
        # root html 은 /etc/nginx/html(없음)을 가리켜 50x 가 404 로 둔갑했다 → 이미지 기본 페이지 경로로.
        location = /50x.html {
            internal;
            root   /usr/share/nginx/html;
        }
    }

    # [대시보드 API server] Cloudflare Worker 대시보드 → portal-backend(:8001) 전용 경로.
    # Host 가 api.aegis3.cloud 인 요청만 여기로 라우팅된다(위 default_server 와 분리).
    # 대시보드 '자체' API(고객사 로그/통계 조회)는 WAF 검사 대상이 아니므로 coraza off
    # — SSE 스트림(/api/logs/stream)·JSON 바디에서의 오탐/끊김을 피한다.
    server {
        listen       80;
        server_name  console.aegis3.cloud; 
        coraza off;

        # Docker 내장 DNS. 아래 변수 proxy_pass 와 함께 쓰면 upstream 을 '시작 시 1회'가
        # 아니라 런타임에 해석 → portal-backend 가 늦게 떠도 nginx 기동이 실패하지 않는다.
        resolver 127.0.0.11 valid=30s ipv6=off;

        location / {
            set $portal_backend http://portal-backend:8001;   # 변수 → 런타임 해석
            proxy_pass $portal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE(/api/logs/stream) 지원: 버퍼링 끄고 타임아웃 길게.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
