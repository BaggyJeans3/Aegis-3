# ==============================
# Aegis-3 API Specification Policy Rules
# Rule ID Range: 120000 - 129999
# ==============================

# [120001] Block dangerous HTTP methods
SecRule REQUEST_METHOD "@rx ^(?:TRACE|TRACK|CONNECT)$" \
    "id:120001,phase:1,deny,status:405,log,auditlog,msg:'Aegis-3 dangerous HTTP method blocked',tag:'aegis3-api-policy'"

# [120002] Allow only common HTTP methods
SecRule REQUEST_METHOD "!@within GET POST PUT PATCH DELETE OPTIONS HEAD" \
    "id:120002,phase:1,deny,status:405,log,auditlog,msg:'Aegis-3 disallowed HTTP method',tag:'aegis3-api-policy'"

# [120010] 제거됨: "/api/ 는 /api/v1/ 아니면 차단"을 가정했으나, 버전 프리픽스 없는
# 고객사 API가 routers 테이블 라우팅 전에 WAF 단에서 막혀버리는 충돌이 있었다.
# 경로별 허용은 이미 routers 테이블(proxy/app.js findRouteFromCache)이 관리한다.

# [120020] Enforce JSON Content-Type for write requests under /api/v1/.
# Exceptions: auth/login and upload endpoints may use form or multipart data.
SecRule REQUEST_URI "@beginsWith /api/v1/" \
    "id:120020,phase:1,deny,status:415,log,auditlog,chain,msg:'Aegis-3 invalid API Content-Type',tag:'aegis3-api-policy'"
    SecRule REQUEST_URI "!@rx ^/api/v1/(auth/login|login|upload|files)" "chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "!@rx ^(?:application/json|multipart/form-data|application/x-www-form-urlencoded)"

# [120030] Detect suspicious attempt to access API documentation in production-like paths
SecRule REQUEST_URI "@rx (?i)^/(swagger-ui|swagger|api-docs|v3/api-docs|openapi\.json)" \
    "id:120030,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 API documentation probing detected',tag:'aegis3-api-policy'"
