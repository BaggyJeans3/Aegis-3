# ==============================
# Aegis-3 Reconnaissance / Scanner Rules
# Rule ID Range: 160000 - 169999
# ==============================

# [160001] Administrative path probing
SecRule REQUEST_URI "@rx (?i)(admin|superadmin|root|manage|management|operator|staff|console|dashboard|control-panel|cpanel)" \
    "id:160001,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 administrative path probing detected',tag:'aegis3-recon'"

# [160010] Known scanner User-Agent
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|masscan|zgrab|gobuster|dirbuster|ffuf|wpscan|acunetix|nessus|openvas|python-requests|libwww-perl)" \
    "id:160010,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 known scanner user-agent detected',tag:'aegis3-scanner'"

# [160011] Suspicious empty or missing User-Agent
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:160011,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 missing User-Agent header detected',tag:'aegis3-scanner'"

# [160012] Suspicious path traversal style probing
# OWASP CRS also detects LFI/path traversal, but this rule logs it as Aegis-3 recon behavior.
SecRule REQUEST_URI "@rx (?i)(\.\./|\.\.\\|%2e%2e%2f|%252e%252e%252f)" \
    "id:160012,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 path traversal probing detected',tag:'aegis3-recon'"

# [160020] Common web shell or upload probing
SecRule REQUEST_URI "@rx (?i)(shell\.php|cmd\.php|webshell|upload\.php|filemanager|phpinfo\.php)" \
    "id:160020,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 web shell probing detected',tag:'aegis3-recon'"
