# ==============================
# Aegis-3 Mass Assignment / Privilege Escalation Rules
# Rule ID Range: 150000 - 159999
# ==============================

# [150001] Suspicious privilege-related parameter name
SecRule ARGS_NAMES "@rx (?i)^(role|roles|admin|isAdmin|is_admin|authority|authorities|permission|permissions|privilege|privileges|grade|level)$" \
    "id:150001,phase:2,deny,status:403,log,auditlog,msg:'Aegis-3 mass assignment privilege parameter detected',tag:'aegis3-mass-assignment'"

# [150002] Suspicious privilege-related JSON field
SecRule REQUEST_BODY "@rx (?i)\"(role|roles|admin|isAdmin|is_admin|authority|authorities|permission|permissions|privilege|privileges|grade|level)\"\s*:" \
    "id:150002,phase:2,deny,status:403,log,auditlog,msg:'Aegis-3 mass assignment JSON field detected',tag:'aegis3-mass-assignment'"

# [150003] Direct attempt to set ADMIN-like value
SecRule ARGS|REQUEST_BODY "@rx (?i)(ROLE_ADMIN|ADMIN|SUPER_ADMIN|ROOT|SUPERUSER)" \
    "id:150003,phase:2,deny,status:403,log,auditlog,msg:'Aegis-3 direct admin privilege value detected',tag:'aegis3-mass-assignment'"

# [150004] Suspicious account status manipulation
SecRule ARGS_NAMES "@rx (?i)^(enabled|disabled|locked|accountNonLocked|account_non_locked|verified|emailVerified|email_verified)$" \
    "id:150004,phase:2,deny,status:403,log,auditlog,msg:'Aegis-3 account status manipulation parameter detected',tag:'aegis3-mass-assignment'"
