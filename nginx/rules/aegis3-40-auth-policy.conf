# ==============================
# Aegis-3 Authorization / Token Policy Rules
# Rule ID Range: 140000 - 149999
# ==============================

# [140001] Missing Authorization header on protected API paths
SecRule REQUEST_URI "@rx ^/api/v1/(private|admin|users/me|members/me|account|profile|orders|payments)" \
    "id:140001,phase:1,deny,status:401,log,auditlog,chain,msg:'Aegis-3 missing Authorization header on protected API',tag:'aegis3-auth-policy'"
    SecRule &REQUEST_HEADERS:Authorization "@eq 0"

# [140002] Invalid Authorization header format on protected API paths
SecRule REQUEST_URI "@rx ^/api/v1/(private|admin|users/me|members/me|account|profile|orders|payments)" \
    "id:140002,phase:1,deny,status:401,log,auditlog,chain,msg:'Aegis-3 invalid Authorization header format',tag:'aegis3-auth-policy'"
    SecRule REQUEST_HEADERS:Authorization "!@rx ^Bearer\s+[A-Za-z0-9._~+/=-]+$"

# [140010] Block suspicious JWT token passed through query string
SecRule ARGS_NAMES "@rx (?i)^(token|access_token|refresh_token|jwt)$" \
    "id:140010,phase:2,deny,status:403,log,auditlog,msg:'Aegis-3 token passed through query parameter detected',tag:'aegis3-auth-policy'"
