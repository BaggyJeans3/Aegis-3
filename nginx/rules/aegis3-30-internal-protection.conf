# ==============================
# Aegis-3 Internal Resource Protection Rules
# Rule ID Range: 130000 - 139999
# ==============================

# [130001] Block Spring Boot Actuator and internal monitoring endpoints
SecRule REQUEST_URI "@rx (?i)^/(actuator|actuator/.*|env|heapdump|metrics|prometheus|beans|configprops|mappings|shutdown)$" \
    "id:130001,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 Spring Boot actuator or internal endpoint access',tag:'aegis3-internal-protection'"

# [130010] Block sensitive project/config files
SecRule REQUEST_URI "@rx (?i)(\.env|\.git|\.svn|\.hg|\.idea|\.vscode|application\.properties|application\.ya?ml|bootstrap\.ya?ml|docker-compose\.ya?ml|Dockerfile|package\.json|package-lock\.json|yarn\.lock|gradle\.properties|settings\.gradle|build\.gradle)" \
    "id:130010,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 sensitive project file access',tag:'aegis3-sensitive-file'"

# [130011] Block backup or temporary file probing
SecRule REQUEST_URI "@rx (?i)(\.bak|\.backup|\.old|\.orig|\.save|\.swp|\.tmp|~)$" \
    "id:130011,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 backup or temporary file probing',tag:'aegis3-sensitive-file'"

# [130012] Block common source map and build artifact probing
SecRule REQUEST_URI "@rx (?i)(\.map|webpack\.config\.js|vite\.config\.js|tsconfig\.json|babel\.config\.js)$" \
    "id:130012,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 frontend build artifact probing',tag:'aegis3-sensitive-file'"

# [130020] Block direct access to infrastructure config paths
SecRule REQUEST_URI "@rx (?i)^/(infra|terraform|\.terraform|nginx|proxy|data|scripts)/" \
    "id:130020,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 infrastructure path probing detected',tag:'aegis3-internal-protection'"
