# ==============================
# Aegis-3 Shadow API Trap Rules
# Rule ID Range: 110000 - 119999
# ==============================

# [110001] Direct access to decoy or shadow API paths
SecRule REQUEST_URI "@rx ^/api/v1/(admin|internal|debug|backup|hidden|test|root|superuser|management|private)$" \
    "id:110001,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 Shadow API trap accessed',tag:'aegis3-shadow-api'"

# [110002] Suspicious privilege-related API probing under users or members
SecRule REQUEST_URI "@rx ^/api/v1/(users|members)/(admin|root|superuser|privilege|role|roles|authority|authorities)$" \
    "id:110002,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 suspicious privilege API probing',tag:'aegis3-shadow-api'"

# [110003] Hidden or internal API keyword probing
SecRule REQUEST_URI "@rx (?i)^/api/v1/.*/(internal|secret|hidden|debug|backup|dev|test|staging|console)$" \
    "id:110003,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 hidden API keyword probing detected',tag:'aegis3-shadow-api'"

# [110004] Fake admin endpoint access
SecRule REQUEST_URI "@rx (?i)^/api/v1/(admin-login|admin-console|admin-panel|root-login|system-admin)$" \
    "id:110004,phase:1,deny,status:403,log,auditlog,msg:'Aegis-3 fake admin endpoint accessed',tag:'aegis3-shadow-api'"
